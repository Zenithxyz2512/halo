name: Rekam harga SRSN

# Tiap 10 menit pada jam bursa, baca Google Sheet berisi rumus GOOGLEFINANCE lalu simpan satu titik harga
# per tanggal di branch data-srsn (SRSN/<tanggal>.json). Palagan Saham memakainya untuk memutar ulang hari sebelumnya.
# Untuk mematikan: tab Actions → Rekam harga SRSN → Disable workflow.
on:
  schedule:
    - cron: '*/10 1-9 * * 1-5'   # 08:00–16:59 WIB, Senin–Jumat
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: rekam-srsn
  cancel-in-progress: false

jobs:
  rekam:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: data-srsn

      - name: Ambil harga dari Google Sheets
        env:
          SHEET_ID: 13HzYceK4HQpsFVIlyWvMLnrOhvCgMJFdcG0lINceCwE
        run: |
          python3 - <<'PY'
          import csv, io, json, os, urllib.request

          url = f"https://docs.google.com/spreadsheets/d/{os.environ['SHEET_ID']}/gviz/tq?tqx=out:csv&gid=0&headers=1"
          req = urllib.request.Request(url, headers={"User-Agent": "palagan-saham-rekam"})
          text = urllib.request.urlopen(req, timeout=20).read().decode("utf-8")
          if text.lstrip().startswith("<"):
              raise SystemExit("Sheet tidak bisa dibaca publik: Google mengirim halaman HTML, bukan CSV")

          def whole(x):
              digits = "".join(ch for ch in x if ch.isdigit())
              return int(digits) if digits else None

          for row in list(csv.reader(io.StringIO(text)))[1:]:
              if len(row) < 8:
                  continue
              code = row[0].strip().upper()
              price, opening, high, low, volume, prev = (whole(row[i]) for i in (1, 2, 3, 4, 5, 6))
              stamp = row[7].strip()
              if len(code) != 4 or not code.isalpha() or not price or not prev or len(stamp) < 19:
                  continue
              date, clock = stamp[:10], stamp[11:19]
              os.makedirs(code, exist_ok=True)
              path = f"{code}/{date}.json"
              if os.path.exists(path):
                  day = json.load(open(path))
              else:
                  day = {"code": code, "date": date, "prev": prev, "open": opening, "points": []}
              points = day["points"]
              point = [clock, price, high, low, volume]
              if points and (points[-1] == point or points[-1][0] > clock):
                  print(f"{code}: belum ada data baru (transaksi terakhir {clock})")
                  continue
              points.append(point)
              day["prev"], day["open"] = prev, day.get("open") or opening
              with open(path, "w") as f:
                  json.dump(day, f, separators=(",", ":"))
              index_path = f"{code}/index.json"
              index = json.load(open(index_path)) if os.path.exists(index_path) else {"code": code, "dates": []}
              if date not in index["dates"]:
                  index["dates"] = sorted(index["dates"] + [date])
                  with open(index_path, "w") as f:
                      json.dump(index, f, separators=(",", ":"))
              print(f"{code}: {date} {clock} harga {price}, volume {volume}")
          PY

      - name: Simpan kalau ada data baru
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then echo 'Tidak ada perubahan'; exit 0; fi
          git commit -m "Rekam harga $(TZ=Asia/Jakarta date +'%Y-%m-%d %H:%M') WIB"
          git push
